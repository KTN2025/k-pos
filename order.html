<style>
:root{--brand:#D62828;--brand-ink:#fff;--accent:#F77F00;--bg:#fff;--soft:#F5F5F7;--ink:#1D1D22;--muted:#6E6E78;--line:#ECECF0;--danger:#C62828;
  --f:"Anuphan","Sukhumvit Set","Thonburi","Noto Sans Thai","Noto Sans",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);-webkit-tap-highlight-color:transparent;padding-bottom:110px}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:760px;margin:0 auto}
/* hero */
.hero{position:relative;height:230px;background:linear-gradient(135deg,var(--brand),var(--accent)) center/cover no-repeat}
.hero .cover{position:absolute;inset:0;background:center/cover no-repeat}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 45%)}
.topbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.pill{background:#fff;border-radius:12px;padding:8px 14px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.12);display:flex;align-items:center;gap:6px;max-width:62vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;flex:none}
.circ svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.circ .dot{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.logo{position:absolute;left:50%;bottom:-62px;transform:translateX(-50%);width:124px;height:124px;border-radius:50%;background:#fff center/cover no-repeat;border:5px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:var(--brand)}
.head{text-align:center;padding:72px 16px 6px}
.head h1{font-size:26px;margin:0;line-height:1.25;text-wrap:balance}
.head .br{color:var(--muted);margin-top:2px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 16px 4px}
.act{height:40px;border-radius:20px;border:1px solid var(--line);padding:0 14px;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:6px;background:#fff}
.act svg{width:18px;height:18px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.mem{background:color-mix(in srgb,var(--accent) 16%,#fff);border-color:transparent}
/* tabs */
.tabs{position:sticky;top:0;z-index:8;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 6px 0 8px;margin-top:8px}
.tabs .ic{width:44px;height:52px;display:flex;align-items:center;justify-content:center;flex:none}
.tabs .ic svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round}
.tl{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tl::-webkit-scrollbar{display:none}
.tab{flex:none;height:52px;padding:0 14px;font-size:17px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.sbox{padding:10px 16px;background:#fff;position:sticky;top:53px;z-index:7;border-bottom:1px solid var(--line)}
.sbox input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--soft);padding:0 14px}
/* menu */
main{padding:0 16px}
.sec{scroll-margin-top:62px;padding-top:18px}
.sec h2{font-size:22px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ph{position:relative;display:block;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--soft)}
@supports not (aspect-ratio:1/1){.ph{height:0;padding-bottom:100%}}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:color-mix(in srgb,var(--brand) 55%,#fff);background:color-mix(in srgb,var(--brand) 8%,#fff)}
.qb{position:absolute;top:8px;right:8px;min-width:30px;height:30px;border-radius:15px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.add{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--brand);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18);line-height:1}
.soldout{position:absolute;inset:0;background:rgba(255,255,255,.62);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--ink)}
.nm{font-weight:700;font-size:16.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{color:var(--muted);font-size:16px}
.card.out .nm,.card.out .pr{opacity:.5}
.empty{text-align:center;color:var(--muted);padding:40px 0}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#fff;border-top:1px solid var(--line);z-index:9}
.big{width:100%;max-width:728px;margin:0 auto;height:56px;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:0 18px}
.big:disabled{opacity:.45}
.big .n{background:rgba(255,255,255,.22);border-radius:10px;padding:2px 10px;margin-right:8px}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:#fff;width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .in.img{padding-top:0}
.sheet .hero2{margin:0 -16px 14px;aspect-ratio:16/10;background:var(--soft) center/cover no-repeat;border-radius:22px 22px 0 0}
.sheet h3{font-size:21px;margin:0 0 10px}
.opt{display:flex;justify-content:space-between;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.opt.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,#fff)}
.step{display:flex;align-items:center;gap:16px;justify-content:center;margin:12px 0}
.step button{width:52px;height:52px;border-radius:14px;background:var(--soft);font-size:26px;font-weight:700;color:var(--brand)}
.step span{font-size:24px;font-weight:700;min-width:40px;text-align:center}
input[type=text],input[type=tel],textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;margin-top:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row small{color:var(--muted);display:block}
.btn2{height:48px;border-radius:12px;background:var(--soft);font-weight:600;padding:0 16px}
.msg{text-align:center;padding:50px 16px;color:var(--muted)}
.msg h2{color:var(--ink);font-size:23px;margin:6px 0}
.ok{width:76px;height:76px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.qrw{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#111;margin:12px 0;text-align:center}
.qrw img{width:240px;height:240px;max-width:100%;image-rendering:pixelated}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:12px 0}
.langs button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border-radius:12px;font-size:18px;font-weight:600;text-align:left}
.langs button.on{background:color-mix(in srgb,var(--brand) 9%,#fff);color:var(--brand)}
.langs .fl{font-size:28px}
.cl button{display:flex;justify-content:space-between;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-size:17px;font-weight:600;text-align:left}
.cl small{color:var(--muted);font-weight:400}
.st{display:inline-block;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--soft)}
.st.ok2{background:#E6F4EA;color:#1E7B34}.st.bad{background:#FDE7E7;color:var(--danger)}
.vendor{text-align:center;font-size:12px;color:var(--muted);padding:28px 16px 8px;line-height:1.6}
.vendor b{color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:16px;right:16px;bottom:92px;background:var(--danger);color:#fff;padding:12px 16px;border-radius:12px;z-index:30;text-align:center;max-width:728px;margin:0 auto}
</style>
</head>

function sections(){
  const q=query.trim().toLowerCase(),match=m=>!q||[m.name,m.en,m.ms].some(x=>String(x||'').toLowerCase().includes(q));
  const out=[];const rec=M.menu.filter(m=>m.rec&&match(m));
  if(rec.length&&!q)out.push({id:'rec',name:t('rec'),items:rec});
  M.cats.forEach(c=>{const items=M.menu.filter(m=>m.cat===c.id&&match(m));if(items.length)out.push({id:c.id,name:nm(c),items})});
  return out}
function card(m,cnt){const img=imgOf(m),n=nm(m);
  return `<button class="card ${m.out?'out':''}" data-m="${m.id}" ${m.out?'disabled':''}><span class="ph">${img?`<img src="${img}" alt="" loading="lazy">`:`<span class="noimg">${esc(n.slice(0,1))}</span>`}${cnt?`<b class="qb num">${cnt}</b>`:''}${m.out?`<span class="soldout">${t('out')}</span>`:'<span class="add" aria-hidden="true">+</span>'}</span><span class="nm">${esc(n)}</span><span class="pr num">${money(m.price)}</span></button>`}
function render(){
  const secs=sections(),cnt={};cart.forEach(l=>cnt[l.mid]=(cnt[l.mid]||0)+l.qty);
  if(!active||!secs.some(s=>s.id===active))active=(secs[0]||{}).id||'';

let spyT=0;window.addEventListener('scroll',()=>{cancelAnimationFrame(spyT);spyT=requestAnimationFrame(()=>{const secs=[...document.querySelectorAll('.sec')];if(!secs.length)return;

function itemSheet(m){let qty=1,note='';const sel=new Set(),img=imgOf(m);
  const draw=()=>{const price=(m.price+m.opts.filter(o=>sel.has(o.name)).reduce((a,o)=>a+(+o.price||0),0))*qty;

function tlv(id,v){return id+String(v.length).padStart(2,'0')+v}
function crc16(x){let c=0xFFFF;for(let i=0;i<x.length;i++){c^=x.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(id,amt){id=String(id).replace(/\D/g,'');let acc=id.length>=15?tlv('03',id):id.length>=13?tlv('02',id):tlv('01',('0000000000000'+('66'+id.replace(/^0/,''))).slice(-13));
  const p=tlv('00','01')+tlv('01','12')+tlv('29',tlv('00','A000000677010111')+acc)+tlv('53','764')+tlv('54',(Math.round(amt*100)/100).toFixed(2))+tlv('58','TH')+'6304';return p+crc16(p)}
function qrImg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createDataURL(6,2)}catch(e){return ''}}

function shrink(file){return new Promise(res=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{let w=700,q=.7,out='';
  for(let k=0;k<6;k++){const sc=Math.min(1,w/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<45000)break;w*=.8;q-=.08}
  res(out.length<48000?out:'')};im.onerror=()=>res('');im.src=rd.result};rd.readAsDataURL(file)})}
function waitPaid(){sheet(`<div class="msg" style="padding:20px"><div class="ok">…</div><h2>${t('reported')}</h2><p id="pst">${t('paidWait')}</p></div>`);let n=0;
  const poll=async()=>{try{const j=await get({action:'tableBill',t:TID,since:SINCE});const el=$('#pst');if(!el)return;if(j.paid){el.parentNode.innerHTML=`<div class="ok">✓</div><h2>${t('paidOk')}</h2><p>${t('thanks')}${MEM?' · '+t('ptsLater'):''}</p>`;return}}catch(e){}if(++n<80)setTimeout(poll,5000)};setTimeout(poll,5000)}
function memSheet(){const ms=M.member||{};
  const rule=t('memRule').replace('{a}',ms.earnPer).replace('{b}',ms.redeemPts).replace('{c}',ms.redeemBaht);
  const show=m=>sheet(`<h3>${t('memTitle')}</h3><div class="msg" style="padding:16px"><h2>${esc(m.name)}</h2><p class="num" style="font-size:30px;font-weight:700;color:var(--brand);margin:6px 0">${m.points} ${t('pts')}</p><p>${rule}</p><p>${t('memAuto')}</p></div>`);
  if(MEM){get({action:'memberLookup',phone:MEM.phone}).then(j=>{if(j.found){setMem({phone:MEM.phone,name:j.name,points:j.points});if($('#sheet').innerHTML)show(MEM)}}).catch(()=>{});show(MEM);return}
  sheet(`<h3>${t('memTitle')}</h3><label>${t('phone')}<input type="tel" id="mp" inputmode="tel" maxlength="10" placeholder="08xxxxxxxx" style="font-size:20px"></label><div style="height:10px"></div><button class="big" id="mchk"><span>${t('check')}</span><span></span></button><div id="mres"></div>`,async e=>{
    const ph=(($('#mp')||{}).value||'').replace(/\D/g,'');
    if(e.target.closest('#mchk')){if(ph.length<9)return toastMsg(t('phoneErr'));try{const j=await get({action:'memberLookup',phone:ph});
      if(j.found){setMem({phone:ph,name:j.name,points:j.points});show(MEM)}else $('#mres').innerHTML=`<p style="margin-top:12px">${t('notMem')}</p><label>${t('name')}<input type="text" id="mn" placeholder="${esc(t('namePh'))}"></label><div style="height:10px"></div><button class="big" id="mjoin"><span>${t('join')}</span><span></span></button>`}catch(err){toastMsg(err.message)}}
    if(e.target.closest('#mjoin')){try{const j=await post({action:'memberJoin',phone:ph,name:$('#mn').value});setMem({phone:ph,name:j.name,points:j.points||0});show(MEM)}catch(err){toastMsg(err.message)}}})}
function toastMsg(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function done(id,tot){$('#bar').hidden=true;
  sheet(`<div class="msg" style="padding:24px 8px"><div class="ok">✓</div><h2>${t('sent')}</h2><p class="num">${t('total')} ${money(tot)}</p><p id="st">${t('waiting')}</p><button class="big" id="more" style="margin-top:12px"><span>${t('more')}</span><span></span></button></div>`,e=>{if(e.target.closest('#more')){$('#sheet').innerHTML='';render()}});
  let n=0;const poll=async()=>{try{const j=await get({action:'qrStatus',id});const el=$('#st');if(!el)return;
    if(j.status==='รับแล้ว'){el.innerHTML=`<b style="color:var(--brand)">${t('accepted')}</b>`;return}if(j.status==='ปฏิเสธ'){el.innerHTML=`<b style="color:var(--danger)">${t('rejected')}</b>`;return}}catch(e){}
    if(++n<60)setTimeout(poll,5000)};setTimeout(poll,4000)}

/* ---------- ย้ายโต๊ะ ---------- */
function setMoved(mv){if(!mv||!mv.to||(MOVED&&MOVED.to===mv.to))return;MOVED=mv;TNAME=mv.toName||TNAME;applyLang();
  const d=document.createElement('div');d.className='toast';d.style.background='var(--brand)';d.textContent=t('movedTo').replace('{n}',TNAME);document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}
async function checkWhere(){if(!TID)return;try{const j=await get({action:'tableWhere',t:TID,since:SINCE});
  if(!SINCE){SINCE=j.now||Date.now();try{sessionStorage.setItem('kpos-since-'+SHOP+'-'+TID,String(SINCE))}catch(e){}}
  if(j.moved)setMoved(j.moved)}catch(e){}}
/* ---------- เหตุการณ์ ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){goSec(tb.dataset.tab);return}
  const m=e.target.closest('[data-m]');if(m&&!$('#sheet').innerHTML){const it=M.menu.find(x=>x.id===m.dataset.m);if(!it||it.out)return;
    if((it.opts&&it.opts.length)||imgOf(it))itemSheet(it);else{const ex=cart.find(l=>l.mid===it.id&&!l.opts.length&&!l.note);if(ex)ex.qty++;else cart.push({mid:it.id,name:it.name,price:+it.price,qty:1,opts:[],note:''});keep();render()}}});
$('#cartBtn').onclick=cartSheet;$('#langBtn').onclick=langSheet;$('#ordBtn').onclick=ordersSheet;$('#catBtn').onclick=()=>M&&catSheet();
$('#srchBtn').onclick=()=>{const b=$('#sbox');b.hidden=!b.hidden;if(!b.hidden)$('#q').focus();else if(query){query='';$('#q').value='';render()}};
$('#q').addEventListener('input',e=>{query=e.target.value;active='';render()});
applyLang();keep();
(async()=>{if(!API){$('#shop').textContent=t('badLink');$('#list').innerHTML=`<div class="empty">${t('rescan')}</div>`;return}
  try{const j=await get({action:'publicMenu'});M=j.menu;
    if(M.theme&&M.theme.brand){document.documentElement.style.setProperty('--brand',M.theme.brand);document.documentElement.style.setProperty('--accent',M.theme.accent||'#F77F00')}
    document.title=M.shopName+' · '+t('title');$('#shop').textContent=M.shopName;$('#branch').textContent=M.branch||'';
    const lg=$('#logo');lg.textContent=(M.shopName||'K').trim().slice(0,1);
    $('#acts').hidden=false;$('#aCall').hidden=!TID;$('#aBill').hidden=!TID;$('#aMem').hidden=!(M.member&&M.member.on);if(MEM)setMem(MEM);
    $('#aCall').onclick=callSheet;$('#aBill').onclick=billSheet;$('#aMem').onclick=memSheet;
    if(!M.qrOn){$('#list').innerHTML=`<div class="msg"><h2>${t('closed')}</h2><p>${t('askStaff')}</p></div>`;return}
    $('#tabs').hidden=false;render();loadPhotos();checkWhere();setInterval(checkWhere,60000)}catch(e){$('#shop').textContent=t('loadFail');$('#list').innerHTML=`<div class="msg">${esc(e.message)}<br><br><button class="btn2" onclick="location.reload()">${t('retry')}</button></div>`}})();
})();
</script>
